<header class="text-white h-[6rem] flex justify-between items-center gap-5 z-10 md:bg-none bg-linear-to-r/srgb from-[#070A21] to-[#14182F] py-4 px-2" [ngClass]="isFixed?'fixed top-0 w-full transition-all ease-in-out duration-200':'relative'">

    <img src="logo.png" alt="logo" class="w-[150px]">
    <span (click)="toggleMenu()" class="md:hidden text-5xl">
        <i class="bi transition-all ease-in duration-300" [ngClass]="isOpenMenu ? 'bi-x':'bi-list'"></i>
    </span>
    <div class="md:static absolute md:flex justify-center p-2 pb-8 left-0 rounded-b-2xl -z-[1] items-center md:bg-none bg-linear-to-r/srgb from-[#070A21] to-[#14182F] md:z-auto md:translate-y-0 w-full md:transition-none transition-all ease-in duration-300"
        [ngClass]="isOpenMenu?'translate-y-[8rem] pointer-events-auto':'translate-y-[calc(-100%)] pointer-events-none'">
        <nav>
            <ul class="flex md:flex-row flex-col justify-center items-center gap-4 font-inter text-md font-semibold ">
                <li><a href="">Home</a></li>
                <li><a href="">Stacks</a></li>
                <li><a href="">Projetos</a></li>
                <li><a href="">Contato</a></li>
            </ul>
        </nav>
    </div>
    <div class="md:flex hidden items-center gap-5 px-5 py-3 rounded-full border border-white/25 shadow-lg leading-5">
        <a href="https://github.com/guxxis" rel="nofollow" target="_blank" class="text-white hover:scale-110 transition">
            <i class="bi bi-github text-xl"></i>
        </a>
        <a href="https://www.linkedin.com/in/gustavogoncalves9914587/" rel="nofollow" target="_blank" class="text-white hover:scale-110 transition">
            <i class="bi bi-linkedin text-xl"></i>
        </a>
        <a href="mailto:contato@guxxis.com" rel="nofollow" target="_blank" class="text-white hover:scale-110 transition">
            <i class="bi bi-envelope text-xl"></i>
        </a>
    </div>
</header>
