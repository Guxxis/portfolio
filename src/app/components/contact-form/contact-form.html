<form [formGroup]="contactForm" (submit)="onSubmit()">
    <div class="flex flex-col justify-center items-center gap-5 *:w-full">
        <div class="flex gap-5 flex-col md:flex-row *:bg-white *:text-black *:p-2 *:rounded-2xl">
            <input formControlName="nome" type="text" placeholder="Seu nome">
            <input formControlName="email" type="email" placeholder="Seu email">
            <input formControlName="telefone" type="tel" placeholder="Seu telefone">
        </div>
        <textarea formControlName="mensagem" type="text" placeholder="Mensagem" class="bg-white text-black p-2 rounded-2xl"></textarea>
        <button type="submit" [disabled]="!contactForm.valid" 
        class="
        text-lg font-medium leading-6 border rounded-xl py-6 px-10 border-[#6971A266] bg-linear-to-r/srgb from-[#161A31] to-[#06091F]
        transition-all ease-in duration-100
        hover:scale-95 hover:shadow-purple-700/50 shadow-l"
        >Enviar</button>
    </div>
</form>
