<section id="conhecimento"
    class="text-white flex flex-col items-center justify-center mt-20 px-5 md:max-w-[1440px] m-auto">
    <h2 class="font-poppins text-5xl uppercase font-black">Stacks</h2>

    <div class="flex flex-wrap justify-evenly w-full py-5 gap-10">
        @for( stack of stacksList; track stack.nome){
        <div class="p-1 border border-[#878787] rounded-xl grow flex-1 min-w-5/12 md:min-w-2/12">
            <img src="{{stack.img}}" alt="{{stack.name}}" class="w-full">
            <!-- <p>{{stack.nome}}</p> -->
        </div>
        }
    </div>

</section>
