<section id="conhecimento"
    class="text-white flex flex-col items-center justify-center mt-20 px-5 gap-10 md:max-w-[1440px] m-auto">
    <h2 class="font-poppins text-5xl uppercase md:font-black text-center">Stacks</h2>

    <div class="flex flex-wrap justify-evenly w-full py-5 md:px-30 gap-10">
        @for( stack of stacksList; track stack.nome){
        <div class="p-1 grow flex-1 flex flex-col justify-center items-center min-w-5/12 md:min-w-2/12 group transition-all ease-in duration-200">

            <img src="{{stack.img}}" alt="{{stack.name}}" class="w-full h-full group-hover:grayscale-100 group-hover:scale-80 group-hover:-translate-y-[10px] transition-all ease-in duration-200">

            <p class="font-bold text-lg md:text-2xl text-transparent group-hover:text-white absolute translate-y-[60px] md:translate-y-[90px] transition-all ease-in duration-200">{{stack.nome}}</p>
        </div>
        }
    </div>

</section>
